# Minimal Hyprland config for Milestone 1 VM bringup. Ugly is fine.
# No Omarchy theming. Success = compositor starts, Foot opens, input works.
monitor=,preferred,auto,1

env = AQ_DRM_DEVICES,/dev/dri/card0

exec-once = foot

bind = SUPER, Return, exec, foot
bind = SUPER, Q, killactive
bind = SUPER_SHIFT, Q, exit
